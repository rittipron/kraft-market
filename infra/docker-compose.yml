services:
  mongo:
    image: mongo:7
    container_name: kraft_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-kraftpass}
      MONGO_INITDB_DATABASE: kraft
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kraft_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASS:-kraftredis}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:-kraftredis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: kraft_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGO_URI: mongodb://admin:${MONGO_PASS:-kraftpass}@mongo:27017/kraft?authSource=admin
      REDIS_URL: redis://:${REDIS_PASS:-kraftredis}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    expose:
      - "3001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - public
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://kraftmarket.com/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://kraftmarket.com}
    container_name: kraft_frontend
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: kraft_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - public
    restart: unless-stopped

networks:
  internal:
    internal: true
  public:

volumes:
  mongo_data:
  redis_data:
