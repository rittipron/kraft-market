# Dev override — HTTP-only nginx + expose DB ports to localhost
# Full dev stack:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# DB only:        docker compose up mongo redis -d
services:
  mongo:
    ports:
      - '27017:27017'
    networks:
      - internal
      - public

  redis:
    ports:
      - '6379:6379'
    networks:
      - internal
      - public

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
        NEXT_PUBLIC_WS_URL: ws://localhost

  nginx:
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
